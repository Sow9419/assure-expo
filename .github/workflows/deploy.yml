name: Déploiement ASSUR EXPO 2026

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP deploy (sans tar — shell désactivé)
        env:
          KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            index.html mail-handler.php \
            "$USER@$HOST:/home/assurexpo/public_html/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            assets \
            "$USER@$HOST:/home/assurexpo/public_html/"
