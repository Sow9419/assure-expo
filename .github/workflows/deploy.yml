name: Déploiement ASSUR EXPO 2026

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/assurexpo/repositories/assure-expo
            git pull origin main
            /bin/cp -Rf * /home/assurexpo/public_html/
